[project]
name = "ros2-uv-demo-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = ["venv-only-dep==1.0.0"]

[tool.uv]
package = false
python-preference = "only-system"
python-downloads = "never"

[tool.uv.sources]
venv-only-dep = { path = "vendor/venv_only_dep-1.0.0-py3-none-any.whl" }
